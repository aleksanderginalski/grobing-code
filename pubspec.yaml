name: grobing
description: "Grobing — groby rodziny, osoby i to, jak łączą się z autorem."
publish_to: 'none'

# Android: build-name → versionName, build-number → versionCode (must grow with every install).
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  # Pinned Flutter (ADR-002). The SDK is shared with another, live app of the author — `pub get`
  # refuses any other version instead of letting an upgrade break either build. The declared value
  # lives in grobing-agents/.claude/rules/project-config.example.md; change both together.
  flutter: 3.41.1

# No Firebase, analytics or crash-reporting SDKs — nothing leaves the phone (PROJECT_BRIEF §Security).
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Database (ADR-005). drift and drift_dev are pinned as a pair: the pinned Flutter holds analyzer at
  # 10.x, so drift_dev cannot go past 2.34.0, and drift 2.34.1+ breaks that drift_dev (the schema dump
  # and migration verifier stop compiling). Move both together, after an SDK decision (ADR-002).
  drift: 2.34.0
  # Bundles its own SQLite through build hooks — VACUUM INTO does not depend on the Android version.
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  crypto: ^3.0.7
  # Backup (ADR-004): primitives for our own age v1 module (lib/backup/age/) — X25519 and
  # ChaCha20-Poly1305 from cryptography, scrypt from pointycastle; both pure Dart, no network.
  # Pinned exactly: the module is gated by the official age test vectors and CLI (ISSUE-008), so a
  # new version of either is a reviewed change, not a `pub upgrade`.
  cryptography: 2.9.0
  pointycastle: 4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
