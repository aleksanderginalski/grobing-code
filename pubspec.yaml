name: grobing
description: "Grobing — groby rodziny, osoby i to, jak łączą się z autorem."
publish_to: 'none'

# Android: build-name → versionName, build-number → versionCode (must grow with every install).
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  # Pinned Flutter (ADR-002). The SDK is shared with another, live app of the author — `pub get`
  # refuses any other version instead of letting an upgrade break either build. The declared value
  # lives in grobing-agents/.claude/rules/project-config.example.md; change both together.
  flutter: 3.41.1

# No Firebase, analytics or crash-reporting SDKs — nothing leaves the phone (PROJECT_BRIEF §Security).
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Database (ADR-005). drift and drift_dev are pinned as a pair: the pinned Flutter holds analyzer at
  # 10.x, so drift_dev cannot go past 2.34.0, and drift 2.34.1+ breaks that drift_dev (the schema dump
  # and migration verifier stop compiling). Move both together, after an SDK decision (ADR-002).
  drift: 2.34.0
  # Bundles its own SQLite through build hooks — VACUUM INTO does not depend on the Android version.
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  crypto: ^3.0.7
  # Backup (ADR-004): primitives for our own age v1 module (lib/backup/age/) — X25519 and
  # ChaCha20-Poly1305 from cryptography, scrypt from pointycastle; both pure Dart, no network.
  # Pinned exactly: the module is gated by the official age test vectors and CLI (ISSUE-008), so a
  # new version of either is a reviewed change, not a `pub upgrade`.
  cryptography: 2.9.0
  pointycastle: 4.0.0
  # Map of Poland (ISSUE-014, ADR-007): polygons, lines and markers only — no tile layer, so nothing is
  # fetched (its `http` dependency serves tiles alone, and the app has no INTERNET permission). Pinned
  # exactly, like the backup crypto: a new version is a reviewed change, not a `pub upgrade`.
  flutter_map: 8.3.2
  latlong2: 0.10.1
  # Photos (ISSUE-016): the system photo picker (Android Photo Picker from Android 13) and the system
  # camera — no storage or camera permission, nothing fetched. Called without maxWidth/imageQuality: the
  # app makes its own 2048 px JPEG (PhotoPreparation.kt, D2'), which the package cannot do for HEIF.
  # Pinned exactly, like the backup crypto and the map: it handles the family's photos.
  image_picker: 1.2.4
  # Imported only to switch on the Android Photo Picker (photo_picker.dart): with its default (off)
  # 0.8.13+17 asks with ACTION_GET_CONTENT, whose window needs "Done" even for one photo (ui review).
  # Pinned to the versions image_picker 1.2.4 resolved, so nothing moves.
  image_picker_android: 0.8.13+17
  image_picker_platform_interface: 2.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    # Outline, rivers and cities of Poland from Natural Earth (public domain); rebuilt by
    # tool/map/extract_poland.dart (README → Mapa).
    - assets/map/poland.json
    # Cemeteries of Poland from OpenStreetMap (ISSUE-015) — © autorzy OpenStreetMap, ODbL 1.0: a derived
    # database under the same licence, attribution shown under the results; rebuilt by
    # tool/cemeteries/extract_cemeteries.dart (README → Baza cmentarzy).
    - assets/cemeteries/poland_cemeteries.json
